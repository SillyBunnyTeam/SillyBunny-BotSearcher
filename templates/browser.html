<div class="sbbs-root" data-view="grid">
    <header>
      <form id="sbbs_search_form" class="sbbs-bar" role="search">
        <div class="sbbs-bar-row">
            <!--
                maxlength fits a pasted card URL (512, matching the server's URL
                cap), not just a query; search terms are still capped at 128 by
                the server and by rememberQuery().
            -->
            <label class="sbbs-visually-hidden" for="sbbs_query">Search character cards</label>
            <input id="sbbs_query" class="text_pole sbbs-query" type="search" aria-label="Search character cards" aria-keyshortcuts="/" placeholder="Search character cards" maxlength="512" enterkeyhint="search" autocomplete="off" spellcheck="false" list="sbbs_query_history">
            <!-- Previous searches, offered by the browser's own dropdown. -->
            <datalist id="sbbs_query_history"></datalist>
            <button id="sbbs_go" class="menu_button sbbs-go" type="submit" title="Search" aria-label="Search">
                <i class="fa-solid fa-magnifying-glass" aria-hidden="true"></i>
            </button>
        </div>
        <div class="sbbs-bar-row sbbs-bar-row-secondary">
            <label class="sbbs-visually-hidden" for="sbbs_source">Card source</label>
            <select id="sbbs_source" class="text_pole sbbs-source" aria-label="Source"></select>
            <label class="sbbs-visually-hidden" for="sbbs_sort">Sort results</label>
            <select id="sbbs_sort" class="text_pole sbbs-sort" aria-label="Sort"></select>
            <!--
                Always present. It holds the content controls below, which apply to
                every source, so hiding it when a source declares no filters of its
                own would put "SFW only" out of reach.
            -->
            <button id="sbbs_filters_toggle" class="menu_button sbbs-filters-toggle" type="button" aria-expanded="false" aria-controls="sbbs_filters">
                <i class="fa-solid fa-sliders" aria-hidden="true"></i>
                <span>Filters</span>
                <span id="sbbs_filters_badge" class="sbbs-filters-badge" hidden></span>
            </button>
        </div>
        <div id="sbbs_filters" class="sbbs-filters" hidden>
            <!--
                Content controls first: they apply to every source and keep their
                value across a source change, unlike the per-source fields below.
            -->
            <div class="sbbs-filter-group">
                <label class="checkbox_label sbbs-sfw">
                    <input id="sbbs_sfw" type="checkbox">
                    <span>SFW only</span>
                </label>
                <label id="sbbs_hide_ai_control" class="checkbox_label sbbs-hide-ai" hidden>
                    <input id="sbbs_hide_ai" type="checkbox">
                    <span>Hide AI-generated</span>
                </label>
            </div>
            <!--
                Populated per source from capabilities.filters, so a control only
                appears when the selected source can actually apply it.
            -->
            <div id="sbbs_filter_fields" class="sbbs-filter-fields"></div>
            <div class="sbbs-filter-actions">
                <button id="sbbs_filters_clear" class="menu_button sbbs-filters-clear" type="button">Clear filters</button>
            </div>
            <!--
                Intake works on any card file, not only ones found here, so the
                picker lives with the controls rather than with the results.
            -->
            <!--
                Card URLs are pasted into the search box itself and recognized
                there; there is no separate URL form.
            -->
            <div class="sbbs-filter-group sbbs-intake-entry">
                <button id="sbbs_inspect_file" class="menu_button sbbs-inspect-file" type="button">
                    <i class="fa-solid fa-file-shield" aria-hidden="true"></i>
                    <span>Inspect a card file</span>
                </button>
                <input id="sbbs_card_file" class="sbbs-visually-hidden" type="file" accept=".png,.json,image/png,application/json" tabindex="-1" aria-hidden="true">
                <span class="sbbs-setting-note">Reports what is inside a PNG or JSON card before importing it. You can also drop one onto this dialog.</span>
            </div>
        </div>
      </form>
    </header>

    <div class="sbbs-body" aria-busy="false">
        <!--
            Describes the results, so it sits with them rather than in the filter
            panel: a source with no reliable SFW filter has to say so whether or
            not the user has the panel open. Still the checkbox's aria-describedby.
        -->
        <span id="sbbs_sfw_note" class="sbbs-control-note" aria-live="polite"></span>
        <span id="sbbs_count" class="sbbs-count" aria-live="polite"></span>
        <div id="sbbs_state" class="sbbs-state" role="status"></div>
        <!-- Sources a merged search could not reach. -->
        <div id="sbbs_partial" class="sbbs-partial" role="status" hidden></div>
        <!-- Offers to clear a failed source's cooldown and try it again. -->
        <div id="sbbs_reload" class="sbbs-reload" hidden></div>
        <!--
            Selecting several cards for one import. Off, it is a single button;
            on, the grid's cards toggle instead of opening and this row carries
            the count and the actions. Sticky, so Import selected stays in reach
            at the bottom of a long grid.
        -->
        <div id="sbbs_selection" class="sbbs-selection" hidden>
            <button id="sbbs_select_toggle" class="menu_button sbbs-select-toggle" type="button" aria-pressed="false">
                <i class="fa-solid fa-square-check" aria-hidden="true"></i>
                <span>Select cards</span>
            </button>
            <span id="sbbs_selection_count" class="sbbs-selection-count" role="status"></span>
            <button id="sbbs_select_all" class="menu_button sbbs-selection-action" type="button">Select all</button>
            <button id="sbbs_import_selected" class="menu_button sbbs-selection-action sbbs-import" type="button" disabled>Import selected</button>
        </div>
        <ul id="sbbs_grid" class="sbbs-grid" role="list"></ul>
        <button id="sbbs_more" class="menu_button sbbs-more" type="button" hidden>Load more</button>
    </div>

    <!--
        Visibility is owned solely by data-view on .sbbs-root. Do NOT add a
        `hidden` attribute here: the [hidden][hidden] rule in style.css outranks
        the data-view selector, so the pane would stay invisible after switching.
    -->
    <section id="sbbs_detail" class="sbbs-detail" aria-label="Card details"></section>
    <section id="sbbs_intake" class="sbbs-intake" aria-label="Review and import"></section>
</div>
