<div class="sbbs-root" data-view="grid">
    <header>
      <form id="sbbs_search_form" class="sbbs-bar" role="search">
        <div class="sbbs-bar-row">
            <label class="sbbs-visually-hidden" for="sbbs_source">Card source</label>
            <select id="sbbs_source" class="text_pole sbbs-source" aria-label="Source"></select>
            <label class="sbbs-visually-hidden" for="sbbs_query">Search character cards</label>
            <input id="sbbs_query" class="text_pole sbbs-query" type="search" aria-label="Search character cards" placeholder="Search character cards" maxlength="128" enterkeyhint="search" autocomplete="off" spellcheck="false" list="sbbs_query_history">
            <!-- Previous searches, offered by the browser's own dropdown. -->
            <datalist id="sbbs_query_history"></datalist>
            <button id="sbbs_go" class="menu_button sbbs-go" type="submit" title="Search" aria-label="Search">
                <i class="fa-solid fa-magnifying-glass" aria-hidden="true"></i>
            </button>
        </div>
        <div class="sbbs-bar-row sbbs-bar-row-secondary">
            <label class="sbbs-visually-hidden" for="sbbs_sort">Sort results</label>
            <select id="sbbs_sort" class="text_pole sbbs-sort" aria-label="Sort"></select>
            <label class="checkbox_label sbbs-sfw">
                <input id="sbbs_sfw" type="checkbox">
                <span>SFW only</span>
            </label>
            <label id="sbbs_hide_ai_control" class="checkbox_label sbbs-hide-ai" hidden>
                <input id="sbbs_hide_ai" type="checkbox">
                <span>Hide AI-generated</span>
            </label>
            <button id="sbbs_filters_toggle" class="menu_button sbbs-filters-toggle" type="button" aria-expanded="false" aria-controls="sbbs_filters" hidden>
                <i class="fa-solid fa-sliders" aria-hidden="true"></i>
                <span>Filters</span>
                <span id="sbbs_filters_badge" class="sbbs-filters-badge" hidden></span>
            </button>
            <span id="sbbs_sfw_note" class="sbbs-control-note" aria-live="polite"></span>
            <span id="sbbs_count" class="sbbs-count" aria-live="polite"></span>
        </div>
        <!--
            Populated per source from capabilities.filters, so a control only
            appears when the selected source can actually apply it.
        -->
        <div id="sbbs_filters" class="sbbs-filters" hidden>
            <div id="sbbs_filter_fields" class="sbbs-filter-fields"></div>
            <div class="sbbs-filter-actions">
                <button id="sbbs_filters_clear" class="menu_button sbbs-filters-clear" type="button">Clear filters</button>
            </div>
        </div>
      </form>
    </header>

    <div class="sbbs-body" aria-busy="false">
        <div id="sbbs_state" class="sbbs-state" role="status"></div>
        <!-- Sources a merged search could not reach. -->
        <div id="sbbs_partial" class="sbbs-partial" role="status" hidden></div>
        <ul id="sbbs_grid" class="sbbs-grid" role="list"></ul>
        <button id="sbbs_more" class="menu_button sbbs-more" type="button" hidden>Load more</button>
    </div>

    <!--
        Visibility is owned solely by data-view on .sbbs-root. Do NOT add a
        `hidden` attribute here: the [hidden][hidden] rule in style.css outranks
        the data-view selector, so the pane would stay invisible after switching.
    -->
    <section id="sbbs_detail" class="sbbs-detail" aria-label="Card details"></section>
</div>
